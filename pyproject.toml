[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fei-assistant"
version = "0.1.0"
description = "A small LangGraph multi-agent assistant"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "langchain>=1.0,<2.0",
  "langchain-openai>=1.0,<2.0",
  "langgraph>=1.0,<2.0",
  "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
]

[project.scripts]
fei-assistant = "fei_assistant.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fei_assistant"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

