<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'"><style>
*{box-sizing:border-box}body{margin:0;height:42px;display:flex;align-items:center;gap:5px;padding:0 8px;color:#626670;background:#f5f5f6;border-bottom:1px solid #dedfe2;font:11px system-ui}button{display:grid;place-items:center;width:27px;height:27px;border:0;border-radius:6px;color:#555;background:transparent;cursor:pointer}button:hover{background:#e6e6e9}button:disabled{opacity:.3}.url{min-width:0;flex:1;overflow:hidden;padding:6px 9px;border:1px solid #e1e2e5;border-radius:6px;background:#fff;text-overflow:ellipsis;white-space:nowrap;font-size:9px}.close{margin-left:2px}
</style></head><body><button id="back" title="后退">←</button><button id="forward" title="前进">→</button><button id="reload" title="刷新">↻</button><div class="url" id="url">招聘网站</div><button class="close" id="close" title="关闭">×</button><script>
const api=window.toolbar;for(const name of ['back','forward','reload','close'])document.getElementById(name).onclick=()=>api.action(name);api.onState(s=>{document.getElementById('url').textContent=s.url||'招聘网站';document.getElementById('back').disabled=!s.canGoBack;document.getElementById('forward').disabled=!s.canGoForward});
</script></body></html>
